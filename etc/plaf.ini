# this file maps the look and feel implementations to names
# they are only shown if the corresponding classes are found
# in the class path
#
# The numbers must be consecutive (from 10 on, reading stops at the first gap).
# Use the name the look and feel reports (LookAndFeel.getName()) where possible:
# the client looks the look and feel up by that name again after switching.

# cross-platform L&F of the JRE
plaf.name.0 =Nimbus
plaf.class.0=javax.swing.plaf.nimbus.NimbusLookAndFeel

# the Java default L&F
plaf.name.1 =Metal
plaf.class.1=javax.swing.plaf.metal.MetalLookAndFeel

# platform L&Fs of the JRE (only shown where supported)
plaf.name.2 =Windows
plaf.class.2=com.sun.java.swing.plaf.windows.WindowsLookAndFeel
plaf.name.3 =CDE/Motif
plaf.class.3=com.sun.java.swing.plaf.motif.MotifLookAndFeel
plaf.name.4 =GTK+
plaf.class.4=com.sun.java.swing.plaf.gtk.GTKLookAndFeel

# FlatLaf from https://www.formdev.com/flatlaf/ (bundled)
plaf.name.5 =FlatLaf Light
plaf.class.5=com.formdev.flatlaf.FlatLightLaf
plaf.name.6 =FlatLaf Dark
plaf.class.6=com.formdev.flatlaf.FlatDarkLaf
plaf.name.7 =FlatLaf IntelliJ
plaf.class.7=com.formdev.flatlaf.FlatIntelliJLaf
plaf.name.8 =FlatLaf Darcula
plaf.class.8=com.formdev.flatlaf.FlatDarculaLaf
plaf.name.9 =FlatLaf macOS Light
plaf.class.9=com.formdev.flatlaf.themes.FlatMacLightLaf
plaf.name.10 =FlatLaf macOS Dark
plaf.class.10=com.formdev.flatlaf.themes.FlatMacDarkLaf
